name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false
      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --no-package-lock
          fi
      - name: Convention gate
        run: npm run check:conventions
      - name: Secret scan
        run: npm run scan:secrets
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --reporter=verbose
      - name: Build
        run: npm run build
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Package immutable release
        run: scripts/build-release.sh "$GITHUB_SHA"
      - name: Verify artifact checksum
        run: cd .release && sha256sum -c "$GITHUB_SHA.tar.gz.sha256"
      - name: Verify tracked tree is clean
        run: |
          git status --porcelain --untracked-files=no
          git diff --exit-code
      - name: Report gate result
        if: always()
        run: |
          {
            echo "## quality"
            echo
            echo "- sha: \`$GITHUB_SHA\`"
            echo "- result: **${{ job.status }}**"
            echo "- node: $(node --version)"
            echo "- lockfile: $([ -f package-lock.json ] && echo present || echo absent)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gateway-${{ github.sha }}
          path: |
            .release/${{ github.sha }}.tar.gz
            .release/${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
