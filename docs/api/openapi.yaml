openapi: 3.1.0
info: { title: LeuwongRR LLM Gateway, version: 0.1.0 }
servers: [{ url: https://api.leuwongrr.cloud }]
paths:
  /health/live:
    get:
      responses: { '200': { description: Minimal liveness } }
  /v1/models:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Capability-filtered models }, '401': { description: Invalid API key } }
  /v1/chat/completions:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 } }
      responses: { '200': { description: Completion or SSE stream }, '400': { description: Invalid request or capability }, '401': { description: Invalid key }, '403': { description: Scope denied }, '402': { description: Budget exhausted }, '503': { description: Overloaded } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
