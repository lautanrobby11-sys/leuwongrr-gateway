name: lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Detect lockfile
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f package-lock.json ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve dependency graph
        if: steps.detect.outputs.present == 'false'
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Open lockfile pull request
        if: steps.detect.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f package-lock.json
          BRANCH="chore/materialize-lockfile-${GITHUB_SHA:0:7}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add package-lock.json
          git commit -m 'chore: materialize package-lock.json for deterministic installs'
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH" \
            --title 'chore: materialize package-lock.json' \
            --body 'Generated by the lockfile workflow. Required before npm ci and scripts/deploy.sh can install deterministically.' \
            || echo 'pull request already exists'

      - name: Report
        if: always()
        shell: bash
        run: |
          {
            echo "## lockfile"
            echo
            echo "- lockfile present at checkout: **${{ steps.detect.outputs.present }}**"
          } >> "$GITHUB_STEP_SUMMARY"
