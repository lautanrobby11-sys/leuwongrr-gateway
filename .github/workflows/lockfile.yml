name: lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]

# A10: pinned to immutable commit SHAs. This workflow holds contents:write and
# can push a branch, so a retagged action here would be strictly worse than in
# the read-only job. Both scopes below are exercised: contents:write for the
# branch push, pull-requests:write for `gh pr create`.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          check-latest: false

      - name: Detect lockfiles
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          root=false
          web=false
          [[ -f package-lock.json ]] && root=true
          [[ -f web/package-lock.json ]] && web=true
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          if [[ "$root" == 'true' && "$web" == 'true' ]]; then
            echo 'missing=false' >> "$GITHUB_OUTPUT"
          else
            echo 'missing=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve root dependency graph
        if: steps.detect.outputs.root == 'false'
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Resolve console dependency graph
        if: steps.detect.outputs.web == 'false'
        run: npm --prefix web install --package-lock-only --no-audit --no-fund

      - name: Open lockfile pull request
        if: steps.detect.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f package-lock.json
          test -f web/package-lock.json
          # A SHA-keyed branch name created a brand new branch and a brand new
          # pull request on every push to main while a lockfile was missing,
          # which is how several chore/materialize-lockfile* branches piled up
          # instead of converging on one. One stable branch means a re-run
          # refreshes the single open pull request.
          BRANCH='chore/materialize-lockfiles'
          [[ "$BRANCH" == 'chore/materialize-lockfiles' ]] || {
            echo 'refusing to force-push outside the dedicated lockfile branch' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add package-lock.json web/package-lock.json
          git commit -m 'chore: materialize package-lock.json for deterministic installs'
          # Not --force-with-lease: fetch-depth 1 plus a locally created branch
          # leaves no remote-tracking ref for the lease to compare against, so
          # the lease fails with stale info as soon as the branch exists on the
          # remote. This branch is bot-owned and regenerated in full each run.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH" \
            --title 'chore: materialize root and console lockfiles' \
            --body 'Generated by the lockfile workflow. Required before npm ci and scripts/deploy.sh can install deterministically.' \
            || echo 'pull request already exists'

      - name: Report
        if: always()
        shell: bash
        run: |
          {
            echo "## lockfile"
            echo
            echo "- root lockfile present at checkout: **${{ steps.detect.outputs.root }}**"
            echo "- console lockfile present at checkout: **${{ steps.detect.outputs.web }}**"
          } >> "$GITHUB_STEP_SUMMARY"
