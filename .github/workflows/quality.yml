name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Verify runner toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          python3 --version
          g++ --version | head -1

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo '::warning title=lockfile absent::package-lock.json is missing, so this run installs a floating dependency graph. scripts/deploy.sh will refuse to release until the lockfile workflow lands it.'
            npm install --no-audit --no-fund --no-package-lock
          fi

      - name: Release readiness
        id: release_readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f package-lock.json ]]; then
            echo 'package-lock.json is required on main before a release artifact can be trusted' >&2
            exit 1
          fi

      - name: Convention gate
        id: conventions
        run: npm run check:conventions

      - name: Secret scan
        id: secrets
        run: npm run scan:secrets

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Tests
        id: tests
        run: npm test -- --reporter=verbose

      - name: Build
        id: build
        run: npm run build

      - name: Shell syntax
        id: shell
        run: bash -n scripts/*.sh

      - name: Package immutable release
        id: package
        run: bash scripts/build-release.sh "$GITHUB_SHA"

      - name: Verify artifact checksum
        id: checksum
        run: cd .release && sha256sum -c "$GITHUB_SHA.tar.gz.sha256"

      - name: Verify tracked tree is clean
        id: clean
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --porcelain --untracked-files=no
          git diff --exit-code

      - name: Publish gate diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- leuwongrr-quality-diagnostics -->';
            const rows = [
              ['checkout', '${{ steps.checkout.outcome }}'],
              ['node', '${{ steps.node.outcome }}'],
              ['toolchain', '${{ steps.toolchain.outcome }}'],
              ['install', '${{ steps.install.outcome }}'],
              ['release_readiness', '${{ steps.release_readiness.outcome }}'],
              ['conventions', '${{ steps.conventions.outcome }}'],
              ['secrets', '${{ steps.secrets.outcome }}'],
              ['lint', '${{ steps.lint.outcome }}'],
              ['typecheck', '${{ steps.typecheck.outcome }}'],
              ['tests', '${{ steps.tests.outcome }}'],
              ['build', '${{ steps.build.outcome }}'],
              ['shell', '${{ steps.shell.outcome }}'],
              ['package', '${{ steps.package.outcome }}'],
              ['checksum', '${{ steps.checksum.outcome }}'],
              ['clean', '${{ steps.clean.outcome }}']
            ];
            const bodyLines = [
              marker,
              '## quality diagnostics',
              '',
              `SHA: \`${context.sha}\``,
              '',
              '| Gate | Outcome |',
              '| --- | --- |',
              ...rows.map(([gate, outcome]) => `| ${gate} | **${outcome}** |`)
            ];
            if ('${{ steps.typecheck.outcome }}' === 'failure' && fs.existsSync('/tmp/typecheck.log')) {
              const diagnostics = fs.readFileSync('/tmp/typecheck.log', 'utf8')
                .split('\n')
                .filter((line) => /error TS\d+:/.test(line))
                .slice(0, 50)
                .join('\n');
              bodyLines.push('', '### TypeScript diagnostics', '', '```text', diagnostics || 'No TS diagnostic line captured.', '```');
            }
            bodyLines.push('', 'Only sanitized compiler diagnostics are copied; no runtime output or secrets.');
            const body = bodyLines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Report job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## quality"
            echo
            echo "- sha: \`$GITHUB_SHA\`"
            echo "- result: **${{ job.status }}**"
            echo "- node: $(node --version 2>/dev/null || echo unavailable)"
            echo "- lockfile: $([[ -f package-lock.json ]] && echo present || echo absent)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ github.sha }}
          path: |
            .release/${{ github.sha }}.tar.gz
            .release/${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
