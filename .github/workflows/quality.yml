name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_ENV: test
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Verify runner toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          python3 --version
          g++ --version | head -1

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo '::warning title=lockfile absent::package-lock.json is missing, so this run installs a floating dependency graph. scripts/deploy.sh will refuse to release until the lockfile workflow lands it.'
            npm install --no-audit --no-fund --no-package-lock
          fi

      - name: Install console dependencies
        id: install_console
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f web/package-lock.json ]]; then
            npm --prefix web ci --no-audit --no-fund
          else
            echo '::warning title=console lockfile absent::web/package-lock.json is missing, so the console builds from a floating dependency graph.'
            npm --prefix web install --no-audit --no-fund --no-package-lock
          fi

      - name: Release readiness
        id: release_readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          if [[ ! -f package-lock.json ]]; then
            echo 'package-lock.json is required on main before a release artifact can be trusted' >&2
            missing=1
          fi
          if [[ ! -f web/package-lock.json ]]; then
            echo 'web/package-lock.json is required on main so the console bundle is reproducible' >&2
            missing=1
          fi
          exit "$missing"

      - name: Convention gate
        id: conventions
        run: npm run check:conventions

      - name: Secret scan
        id: secrets
        run: npm run scan:secrets

      - name: Lint
        id: lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee /tmp/tests.log

      - name: Build gateway and console
        id: build
        run: npm run build:all

      - name: Verify console bundle
        id: console
        shell: bash
        run: |
          set -Eeuo pipefail
          for entry in admin member chat login; do
            test -f "dist/public/$entry.html" || {
              echo "dist/public/$entry.html is missing; the console would answer 503 console_not_built in production" >&2
              exit 1
            }
          done
          test -d dist/public/assets

      - name: Shell syntax
        id: shell
        run: bash -n scripts/*.sh

      - name: Package immutable release
        id: package
        run: bash scripts/build-release.sh "$GITHUB_SHA"

      - name: Verify artifact checksum
        id: checksum
        run: cd .release && sha256sum -c "$GITHUB_SHA.tar.gz.sha256"

      - name: Verify tracked tree is clean
        id: clean
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --porcelain --untracked-files=no
          git diff --exit-code

      - name: Publish gate diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- leuwongrr-quality-diagnostics -->';
            const rows = [
              ['checkout', '${{ steps.checkout.outcome }}'],
              ['node', '${{ steps.node.outcome }}'],
              ['toolchain', '${{ steps.toolchain.outcome }}'],
              ['install', '${{ steps.install.outcome }}'],
              ['install_console', '${{ steps.install_console.outcome }}'],
              ['release_readiness', '${{ steps.release_readiness.outcome }}'],
              ['conventions', '${{ steps.conventions.outcome }}'],
              ['secrets', '${{ steps.secrets.outcome }}'],
              ['lint', '${{ steps.lint.outcome }}'],
              ['typecheck', '${{ steps.typecheck.outcome }}'],
              ['tests', '${{ steps.tests.outcome }}'],
              ['build', '${{ steps.build.outcome }}'],
              ['console', '${{ steps.console.outcome }}'],
              ['shell', '${{ steps.shell.outcome }}'],
              ['package', '${{ steps.package.outcome }}'],
              ['checksum', '${{ steps.checksum.outcome }}'],
              ['clean', '${{ steps.clean.outcome }}']
            ];
            const required = ['conventions','secrets','lint','typecheck','tests','build','console','shell','package','checksum','clean'];
            const redRequired = rows.filter(([gate, outcome]) => required.includes(gate) && outcome !== 'success');
            const bodyLines = [
              marker,
              '## quality diagnostics',
              '',
              `SHA: \`${context.sha}\``,
              '',
              redRequired.length === 0
                ? '**Merge/deploy gate: GREEN** — required PR gates are success.'
                : '**Merge/deploy gate: RED — do not merge or deploy.** Fix required gates first.',
              '',
              '| Gate | Outcome |',
              '| --- | --- |',
              ...rows.map(([gate, outcome]) => `| ${gate} | **${outcome}** |`)
            ];
            function appendBlock(title, lines) {
              bodyLines.push('', `### ${title}`, '', '```text', (lines && lines.length ? lines.join('\n') : 'No matching diagnostic line captured.'), '```');
            }
            function readLines(path) {
              if (!fs.existsSync(path)) return [];
              return fs.readFileSync(path, 'utf8').split('\n');
            }
            if ('${{ steps.lint.outcome }}' === 'failure') {
              const lines = readLines('/tmp/lint.log').filter((line) => /error|✖|problems?|\.ts:/.test(line)).slice(0, 40);
              appendBlock('Lint diagnostics', lines);
            }
            if ('${{ steps.typecheck.outcome }}' === 'failure') {
              const lines = readLines('/tmp/typecheck.log').filter((line) => /error TS\d+:/.test(line)).slice(0, 40);
              appendBlock('TypeScript diagnostics', lines);
            }
            if ('${{ steps.tests.outcome }}' === 'failure') {
              const all = readLines('/tmp/tests.log');
              const matched = all.filter((line) => /FAIL |AssertionError|Error:|× |✓ |Test Files|Tests /.test(line)).slice(0, 60);
              appendBlock('Test failures', matched.length ? matched : all.slice(-60));
            }
            bodyLines.push('', 'Only sanitized compiler/test diagnostics are copied; no runtime secrets.');
            bodyLines.push('', 'Rule: red required gate => no merge, no deploy, no DONE status.');
            const body = bodyLines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Report job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## quality"
            echo
            echo "- sha: \`$GITHUB_SHA\`"
            echo "- result: **${{ job.status }}**"
            echo "- node: $(node --version 2>/dev/null || echo unavailable)"
            echo "- root lockfile: $([[ -f package-lock.json ]] && echo present || echo absent)"
            echo "- console lockfile: $([[ -f web/package-lock.json ]] && echo present || echo absent)"
            echo "- rule: red required gate => no merge/deploy"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ github.sha }}
          path: |
            .release/${{ github.sha }}.tar.gz
            .release/${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
