name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: npm run build
      - name: Validate operational scripts
        run: bash -n scripts/*.sh
      - name: Build immutable production artifact
        run: scripts/build-release.sh "$GITHUB_SHA"
      - name: Verify artifact checksum
        run: cd .release && sha256sum -c "$GITHUB_SHA.tar.gz.sha256"
      - name: Verify tracked tree remains clean
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ github.sha }}
          path: |
            .release/${{ github.sha }}.tar.gz
            .release/${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
